<div
  class="mt-20 flex flex-wrap justify-end items-center gap-2 sm:gap-4  text-gray-700 text-sm sm:text-base"
>
  <button
    (click)="prev()"
    [disabled]="currentPage === 1"
    class="flex items-center gap-1 px-2 sm:px-3 py-1 hover:bg-gray-100 disabled:opacity-40 transition"
  >
    <fa-icon [icon]="faAngleLeft"></fa-icon>
    <span class="hidden sm:inline">Previous</span>
  </button>

  <div class="flex flex-wrap justify-center gap-1 sm:gap-2">
    <button
      *ngFor="let page of visiblePages"
      (click)="goToPage(page)"
      [class.bg-blue-600]="page === currentPage"
      [class.text-white]="page === currentPage"
      class="px-2 sm:px-3 py-1 rounded-lg hover:text-black border-gray-300 hover:bg-gray-50 transition"
    >
      {{ page }}
    </button>
  </div>

  <button
    (click)="next()"
    [disabled]="currentPage === totalPages"
    class="flex items-center gap-1 px-2 sm:px-3 py-1 rounded-lg  border-gray-300 hover:bg-gray-100 disabled:opacity-40 transition"
  >
    <span class="hidden sm:inline">Next</span>
    <fa-icon [icon]="faAngleRight"></fa-icon>
  </button>
</div>
