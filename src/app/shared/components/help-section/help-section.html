<div class="w-full bg-[#FEB854] mt-10 py-20 font-poppins">
  <div class="max-w-3xl mx-auto text-center px-6">
    <h1 class="text-3xl md:text-2xl font-bold text-white mb-4">STILL NEED HELP?</h1>
    <p class="text-white/90 text-sm md:text-base mb-10 leading-relaxed">
      These are popular categories that users were most interested in recently. The products are
      optimized to give you best value for money.
    </p>

    <div
      class="flex flex-col sm:flex-row items-center justify-center rounded-full shadow-md overflow-hidden max-w-xl mx-auto border border-white"
    >
      <input
        type="text"
        placeholder="Type your query here..."
        class="w-full px-6 py-3 text-white placeholder-white bg-transparent focus:outline-none text-sm md:text-base"
      />
      <button
        class="flex items-center justify-center gap-2 bg-white hover:bg-gray-700 text-[#FEB854] hover:text-white px-6 py-3 font-medium transition-all duration-300"
      >
        <fa-icon [icon]="faArrowRight" class="text-lg"></fa-icon>
      </button>
    </div>
  </div>
</div>
