<nav class="w-full bg-[#38149E08] top-0 z-50 shadow-md font-poppins">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 lg:h-20">
      <!-- left: logo -->
      <div class="flex items-center lg:pl-10">
        <a routerLink="/" class="flex items-center">
          <img src="/logo.png" alt="Logo"
               class="w-[120px] sm:w-[140px] md:w-[160px] lg:w-[200px] object-contain" />
        </a>
      </div>

      <!-- center / desktop menu -->
      <div class="hidden md:flex md:items-center md:space-x-6 lg:space-x-8">
        <a routerLink="/" class="text-sm text-gray-700 hover:text-[#FEB854]">Home</a>
        <a routerLink="/category" class="text-sm text-gray-700 hover:text-[#FEB854]">Category</a>
        <a routerLink="/products" class="text-sm text-red-500 hover:text-red-700">Hot Deals</a>
        <a routerLink="/about-us" class="text-sm text-gray-700 hover:text-[#FEB854]">About Us</a>
        <a routerLink="/contact-us" class="text-sm text-gray-700 hover:text-[#FEB854]">Contact Us</a>
      </div>

      <!-- right: account + mobile button -->
      <div class="flex items-center space-x-4">
        <!-- account (desktop) -->
        <div class="hidden md:block relative">
          <button
            (click)="toggleAccountMenu()"
            (keydown.enter)="toggleAccountMenu()"
            aria-haspopup="true"
            [attr.aria-expanded]="showAccountMenu"
            class="flex items-center space-x-2 text-sm text-gray-700 hover:text-[#FEB854] focus:outline-none"
          >
            <fa-icon [icon]="faUser" class="text-md"></fa-icon>
            <span *ngIf="isLoggedIn; else guest">{{ userName }}</span>
            <ng-template #guest>
              <a routerLink="/auth/signup" class="text-sm hover:text-[#FEB854]">Sign in / Register</a>
            </ng-template>
          </button>

          <!-- account dropdown -->
          <div
            *ngIf="isLoggedIn && showAccountMenu"
            class="absolute right-0 mt-2 w-40 bg-white text-gray-700 rounded-lg shadow-md py-2 z-20"
          >
            <button class="block w-full text-left px-4 py-2 hover:text-[#FEB854]">My Profile</button>
            <button (click)="logout()" class="block w-full text-left px-4 py-2 hover:text-red-500">Logout</button>
          </div>
        </div>

        <!-- mobile hamburger -->
        <button
          (click)="toggleMenu()"
          aria-label="Open menu"
          [attr.aria-expanded]="isMenuOpen"
          class="md:hidden inline-flex items-center justify-center p-2 rounded-md text-gray-700 hover:text-[#FEB854] focus:outline-none"
        >
          <fa-icon [icon]="isMenuOpen ? faTimes : faBars" class="text-xl text-[#FEB854]"></fa-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- mobile menu (collapsible) -->
  <div
    *ngIf="isMenuOpen"
    class="md:hidden bg-white border-t border-gray-200 shadow-inner"
    role="menu"
  >
    <div class="px-6 pt-4 pb-6">
      <ul class="space-y-4 text-left">
        <li><a routerLink="/" (click)="closeMenu()" class="block text-gray-700 hover:text-[#FEB854]">Home</a></li>
        <li><a routerLink="/category" (click)="closeMenu()" class="block text-gray-700 hover:text-[#FEB854]">Category</a></li>
        <li><a routerLink="/products" (click)="closeMenu()" class="block text-red-500 hover:text-red-700">Hot Deals</a></li>
        <li><a routerLink="/about-us" (click)="closeMenu()" class="block text-gray-700 hover:text-[#FEB854]">About Us</a></li>
        <li><a routerLink="/contact-us" (click)="closeMenu()" class="block text-gray-700 hover:text-[#FEB854]">Contact Us</a></li>

        <li class="pt-2 border-t border-gray-100">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <fa-icon [icon]="faUser" class="text-xl text-[#FEB854]"></fa-icon>
              <div>
                <div *ngIf="isLoggedIn; else mobileGuest" class="text-sm font-medium text-gray-800">
                  {{ userName }}
                </div>
                <ng-template #mobileGuest>
                  <a routerLink="/auth/signup" (click)="closeMenu()" class="text-sm text-gray-700 hover:text-[#FEB854]">Sign in / Register</a>
                </ng-template>
              </div>
            </div>

            <div *ngIf="isLoggedIn">
              <button (click)="logout(); closeMenu()" class="text-sm text-red-500 hover:underline">Logout</button>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
