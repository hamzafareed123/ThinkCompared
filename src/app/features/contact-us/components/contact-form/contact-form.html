<div
  class="container mx-auto m mt-16 px-6 sm:px-10 py-10 grid grid-cols-1 md:grid-cols-2 gap-10 bg-white rounded-2xl"
>
  <div class="">
    <div class="space-y-6 text-gray-700">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-600">
        Get in <span class="text-[#FEB854]">Touch </span>With Us
      </h1>

      <div>
        <h3 class="text-lg font-semibold text-gray-600">Phone</h3>
        <p class="text-gray-600">+1 123 123 133 123</p>
      </div>

      <div>
        <h3 class="text-lg font-semibold text-gray-500">Email</h3>
        <p class="text-gray-600">email@company.com</p>
      </div>

      <div>
        <h3 class="text-lg font-semibold text-gray-600">Address</h3>
        <p class="text-gray-600">Office no. 1, Street no. 1, Main Area Road, New London</p>
      </div>
    </div>
  </div>

  <div>
    <form
      #userForm="ngForm"
      (ngSubmit)="onSubmit(userForm.value)"
      class="bg-white rounded-2xl shadow-md p-6 sm:p-8 space-y-5"
    >
      <div>
        <label class="block font-semibold text-gray-700 mb-2">Full Name</label>
        <input
          #name="ngModel"
          ngModel
          required
          name="username"
          type="text"
          placeholder="Enter your Full Name"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FEB854]"
        />
        <span class="error" *ngIf="name.invalid && name.touched">Name is Required</span>
      </div>

      <div>
        <label class="block font-semibold text-gray-700 mb-2">Email</label>
        <input
          #email="ngModel"
          ngModel
          required
          name="email"
          type="email"
          placeholder="Enter your Email here"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FEB854]"
        />
        <span class="error" *ngIf="email.invalid && email.touched">Email is Required</span>
      </div>

      <div>
        <label class="block font-semibold text-gray-700 mb-2">Phone</label>
        <input
          ngModel
          required
          #phone="ngModel"
          name="phone"
          minlength="11"
          maxlength="11"
          type="text"
          placeholder="Enter your Phone Number here"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FEB854]"
        />
        <span class="error" *ngIf="phone.invalid && phone.touched">Phone Number is Required</span>
        <span class="error" *ngIf="phone.errors?.['minlength'] && phone.errors?.['minlength']"
          >Number must be at least 11 digits</span
        >
      </div>

      <div>
        <label class="block font-semibold text-gray-700 mb-2">Message</label>
        <textarea
          ngModel
          required
          #message="ngModel"
          name="message"
          rows="5"
          placeholder="Enter your Message here..."
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FEB854]"
        ></textarea>
        <span class="error" *ngIf="message.invalid && message.touched">Enter Your Message</span>
      </div>

      <div class="flex flex-col items-center">
        <button
          [disabled]="!userForm.valid || isSubmitting"
          type="submit"
          class="text-center bg-[#FEB854] text-white py-3 px-3 rounded-lg text-md font-semibold hover:bg-[#f6a934] transition-all"
        >
          <span *ngIf="!isSubmitting">Send Message</span>
          <span *ngIf="isSubmitting">Sending...</span>
        </button>

        <p class="mt-4 text-green-600 font-semibold" *ngIf="successMessage">
          {{ successMessage }}
        </p>
      </div>
    </form>
  </div>
</div>
