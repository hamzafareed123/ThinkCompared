<div class="container mx-auto mt-20 px-4">
  <h1 class="text-center text-4xl font-bold text-[#595B5C]">BEST SELLERS</h1>
  <p class="text-center text-lg text-[#595B5C] mb-20">
    Search your way through top sellers
  </p>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
    <div
      *ngFor="let brand of brands  | slice:0:12; let i= index"
      (click)="onBrandClick(brand)"
      class="cursor-pointer border rounded-md overflow-hidden hover:border-[#FEB854] flex items-center justify-center bg-white p-4 transition-all duration-300"
    >
      <img
        [src]="'best-seller/img' +(i+1) + '.png'"
        [alt]="brand"
        class="w-17 h-17 object-contain hover:scale-105 transition-transform duration-300"
      />
    </div>
  </div>

  <div class="mt-10 text-center">
    <button
      class="py-3 px-8 text-md rounded-full bg-[#FEB854] text-white hover:bg-[#f6ad36] transition-all duration-200"
    >
      Explore more
    </button>
  </div>
</div>
