<div class="w-full mt-20 flex flex-col items-center justify-center">
  <div class="text-gray-700 text-center w-full max-w-7xl px-4">
    <div class="max-w-3xl mx-auto">
      <h1 class="text-[#595B5C] text-3xl md:text-4xl font-semibold">POPULAR CATEGORY</h1>
      <p class="text-[16px] md:text-[18px] mt-3 text-gray-600">
        These are popular categories that users were most interested in recently. The products are
        optimized to give you best value for money.
      </p>
    </div>

    <div *ngIf="isLoading" class="flex flex-col items-center justify-center mt-16">
      <fa-icon [icon]="faSpinner" class="text-[#FEB854] text-5xl animate-spin"></fa-icon>
      <p class="text-gray-500 mt-3 text-md font-medium">Loading popular categories...</p>
    </div>

    <div *ngIf="!isLoading" class="mt-12 w-full">
      <div
        class="flex gap-4 sm:gap-6 overflow-x-auto scrollbar-hide py-4 px-2 snap-x snap-mandatory"
      >
        <div
          *ngFor="let product of productsDetails"
          (click)="onProductClick(product)"
          class="w-[70%] sm:w-[45%] md:w-[30%] lg:w-[24%] flex-shrink-0 border border-gray-300 rounded-2xl shadow-sm hover:shadow-lg hover:border-[#FEB854] transition-all duration-300 bg-white snap-center cursor-pointer"
        >
          <a [routerLink]="['/products/product-items', product.id]">
            <img
              [src]="product.images?.additional_images?.[0]"
              alt="{{ product.title }}"
              class="w-full h-40 sm:h-52 object-contain rounded-t-2xl bg-gray-100"
            />
            <div class="p-4 text-left">
              <h3 class="text-gray-800 text-base md:text-lg font-semibold line-clamp-2">
                {{ product.title }}
              </h3>
              <p class="text-sm text-gray-500 mt-1">{{ product.brand }}</p>
              <p class="text-[#FEB854] text-lg font-bold mt-2">
                {{ product.price?.[0]?.symbol }}{{ product.price?.[0]?.amount }}
              </p>
            </div>
          </a>
        </div>
      </div>
    </div>

    <div class="mt-10" *ngIf="!isLoading">
      <button
        class="py-3 px-8 text-md rounded-full bg-[#FEB854] text-white hover:bg-[#f6ad36] transition-all duration-200"
      >
        All Categories
      </button>
    </div>
  </div>
</div>
