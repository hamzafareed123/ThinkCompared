<div class="p-6">
  <h2 class="text-2xl font-bold mb-6">Compare Products</h2>

  <p *ngIf="!products.length" class="text-gray-500 text-base mb-4">
    No products added for comparison.
  </p>

  <div *ngIf="productMessage" class="text-red-500 p-3">
    {{ productMessage  }}
  </div>

  <div
    *ngFor="let product of products; let i = index"
    class="mb-5 bg-gray-50 p-5 rounded-xl shadow-md flex items-center justify-between hover:shadow-lg transition-shadow duration-300 w-full"
  >
    <div class="flex items-center gap-4">
      <img
        [src]="product.images?.additional_images?.[0] || 'https://via.placeholder.com/80'"
        alt="{{ product.title }}"
        class="w-24 h-24 object-cover rounded-lg"
      />
      <div>
        <p class="font-light text-sm">{{ product.title }}</p>
        <p class="text-sm text-gray-600">{{ product.brand }}</p>
      </div>
    </div>
    <button mat-icon-button color="warn" (click)="onRemove(i)">
      <mat-icon class="text-xl">close</mat-icon>
    </button>
  </div>

  
  <button
    mat-raised-button
    color="primary"
    class="w-full py-3 text-lg font-semibold !bg-[#FEB854] !text-white !rounded-md  "
    [disabled]="products.length < 2"
    (click)="navigateToProducts()"
  >
    Compare
  </button>

  <button mat-button (click)="onClose()"
  class="w-full py-3 text-lg font-semibold text-center mt-4 !bg-blue-100 !rounded-md">Close</button>
</div>
