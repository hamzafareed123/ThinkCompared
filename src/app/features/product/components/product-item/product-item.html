<app-search-bar></app-search-bar>

<div *ngIf="isLoading" class="flex flex-col items-center justify-center mt-16">
  <fa-icon [icon]="faSpinner" class="text-[#FEB854] text-5xl animate-spin"></fa-icon>
  <p class="text-gray-500 mt-3 text-md font-medium">Loading Product...</p>
</div>

<div *ngIf="!isLoading" class="flex flex-col items-center max-w-6xl mx-auto p-4 gap-12">
  <div class="flex flex-col lg:flex-row gap-10 items-start justify-center w-full">
    <div class="flex flex-col lg:flex-row gap-6 items-center justify-center flex-1">
      <div class="flex lg:flex-col flex-row gap-3 justify-center items-center">
        <img
          *ngFor="let img of thumbnails; let i = index"
          [src]="img"
          (click)="selectImage(i)"
          [class.border-2]="selectedIndex === i"
          class="w-16 h-16 object-cover cursor-pointer border border-gray-300 rounded hover:scale-105 transition-transform"
        />
      </div>

      <div class="flex items-center justify-center">
        <img
          [src]="mainImage"
          alt="Main product image"
          class="w-full max-w-[400px] h-[380px] sm:h-[430px] object-contain border border-gray-300 rounded shadow-md"
        />
      </div>
    </div>

    <div class="w-full lg:w-[35%] flex flex-col gap-4">
      <h1 class="text-2xl font-bold text-gray-800">{{ product.title }}</h1>
      <h3 class="text-gray-600">Brand: {{ product.brand }}</h3>
      <h3 class="text-gray-600">Availability: {{ product.availability }}</h3>
      <h3 class="text-gray-600">Condition: {{ product.condition }}</h3>
      <h3 class="text-[#FEB854] text-xl font-bold">
        Price: {{ product.price?.[0]?.symbol }}{{ product.price?.[0]?.amount }}
      </h3>

      <a [href]="product.url" target="_blank" rel="noopener">
        <button
          class="py-2 px-6 bg-[#FEB854] text-white rounded hover:bg-[#f6ad36] transition font-semibold"
        >
          Go To Shop
        </button>
      </a>
    </div>
  </div>

  <div class="w-full text-center mt-8 border-t pt-6">
    <h2 class="text-2xl font-semibold text-gray-800 mb-3">Product Description</h2>
    <p class="text-gray-600 leading-relaxed max-w-3xl mx-auto">
      {{ product.longDescription }}
    </p>
  </div>
</div>

<app-best-seller></app-best-seller>
<app-help-section></app-help-section>
